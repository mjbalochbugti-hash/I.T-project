<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:290px;background:#0f0f0f;color:#f5f5f5;font-family:'Segoe UI',Arial,sans-serif;padding:16px}
.header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #1e1e1e}
.logo-text h1{font-size:15px;font-weight:800}
.logo-text h1 span{color:#e63946}
.logo-text p{font-size:10px;color:#555;margin-top:1px}
.status-box{background:#1a1a1a;border:1px solid #252525;border-radius:10px;padding:14px;margin-bottom:12px;min-height:60px;font-size:13px}
.url-text{color:#666;font-size:11px;margin-top:6px;word-break:break-all}
.reason{font-size:12px;color:#999;margin-top:5px}
.safe{color:#2ecc71;font-weight:700;font-size:15px}
.suspicious{color:#f1c40f;font-weight:700;font-size:15px}
.malicious{color:#e63946;font-weight:700;font-size:15px}
.scanning{color:#888;font-style:italic}
button{width:100%;background:#e63946;color:#fff;border:none;padding:11px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;margin-bottom:9px}
button:hover{background:#c5293a}
.dash-link{display:block;text-align:center;font-size:12px;color:#666;text-decoration:none}
.dash-link:hover{color:#e63946}
</style>
</head>
<body>
  <div class="header">
    <svg width="34" height="34" viewBox="0 0 40 40" fill="none">
      <path d="M20 3L35 9.5V20.5C35 29.5 28.5 36 20 38.5C11.5 36 5 29.5 5 20.5V9.5Z" fill="#1a1a1a" stroke="#fff" stroke-width="1.6"/>
      <rect x="13.5" y="19.5" width="13" height="10" rx="2.5" fill="#e63946"/>
      <path d="M16.5 19.5V15.5a3.5 3.5 0 017 0v4" fill="none" stroke="#e63946" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="20" cy="24" r="1.8" fill="#1a1a1a"/>
    </svg>
    <div class="logo-text">
      <h1>Shield<span>Scan</span></h1>
      <p>Detect. Analyze. Protect.</p>
    </div>
  </div>
  <div class="status-box" id="statusBox">
    <span class="scanning">Loading…</span>
  </div>
  <button id="rescanBtn">🔍 Scan This Page</button>
  <a href="http://localhost:5500/dashboard.html" target="_blank" class="dash-link">Open Full Dashboard →</a>
  <script src="popup.js"></script>
</body>
</html>
